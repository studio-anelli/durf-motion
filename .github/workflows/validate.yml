name: Validate plugin changes

on:
  pull_request:
    paths:
      - '**.php'
      - 'assets/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Check JavaScript syntax
        run: find assets -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Confirm WordPress plugin version
        run: |
          grep -q 'Version: 1.10.6' durf-motion.php
          grep -q "const VERSION = '1.10.6'" durf-motion.php
